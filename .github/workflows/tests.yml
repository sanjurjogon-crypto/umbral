name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verificar sintaxis y compilación
        run: python -m compileall -q main.py umbral tests
      - name: Comprobar dependencias críticas
        run: python -c "import PySide6, PIL, numpy, umbral; print('OK:', umbral.__version__)"
      - name: Ejecutar tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v --tb=short

