name: release-linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release (p. ej. v8.27.0)"
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar librerías Qt y PyInstaller
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Compilar Umbral-linux-x86_64
        run: |
          python -m PyInstaller --noconfirm Umbral.spec
          mv dist/Umbral dist/Umbral-linux-x86_64
          chmod 755 dist/Umbral-linux-x86_64
          (cd dist && sha256sum Umbral-linux-x86_64 > Umbral-linux-x86_64.sha256)
      - name: Subir binario Linux al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          for i in $(seq 1 18); do
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/Umbral-linux-x86_64 dist/Umbral-linux-x86_64.sha256 --repo "${{ github.repository }}" --clobber
              exit 0
            fi
            sleep 5
          done
          gh release create "$TAG" dist/Umbral-linux-x86_64 dist/Umbral-linux-x86_64.sha256 \
            --repo "${{ github.repository }}" \
            --title "Umbral ${TAG#v}" \
            --notes "Release automático para Linux (x86_64)."
